<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">RAG chatbot architecture</title>
  <desc id="d">Customers reach Application Gateway in the hub VNet. It forwards to the App Service in the spoke VNet through a private endpoint. The app reaches Azure AI Search, Cosmos DB, Blob Storage, Key Vault and Azure OpenAI only through private endpoints.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F4E8C"/></marker>
  </defs>
  <rect width="980" height="580" fill="#FFFFFF"/>

  <rect x="30" y="20" width="190" height="46" rx="23" fill="#EAF1F9" stroke="#1F4E8C" stroke-width="1.5"/>
  <text x="125" y="48" font-size="15" font-weight="600" fill="#14202E" text-anchor="middle">Customers (internet)</text>

  <rect x="20" y="100" width="250" height="190" rx="10" fill="#F4F8FC" stroke="#9DB8D6" stroke-dasharray="6 5"/>
  <text x="36" y="124" font-size="15" font-weight="600" fill="#1F4E8C">Hub VNet</text>
  <rect x="45" y="150" width="200" height="66" rx="8" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <text x="145" y="178" font-size="15" font-weight="600" fill="#14202E" text-anchor="middle">Application Gateway</text>
  <text x="145" y="198" font-size="12.5" fill="#4A5B6D" text-anchor="middle">Standard v2, only public endpoint</text>

  <rect x="300" y="100" width="650" height="440" rx="10" fill="#F4F8FC" stroke="#9DB8D6" stroke-dasharray="6 5"/>
  <text x="316" y="124" font-size="15" font-weight="600" fill="#1F4E8C">Spoke VNet</text>
  <rect x="330" y="150" width="190" height="66" rx="8" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <text x="425" y="178" font-size="15" font-weight="600" fill="#14202E" text-anchor="middle">App Service</text>
  <text x="425" y="198" font-size="12.5" fill="#4A5B6D" text-anchor="middle">identity + VNet integration</text>

  <rect x="570" y="136" width="360" height="388" rx="8" fill="#FFFFFF" stroke="#8CC7BE" stroke-dasharray="5 4"/>
  <text x="586" y="158" font-size="13.5" font-weight="600" fill="#0E6F63">Private endpoints subnet</text>

  <g stroke="#1F4E8C" stroke-width="1.5" fill="#FFFFFF">
    <rect x="590" y="172" width="320" height="56" rx="8"/>
    <rect x="590" y="242" width="320" height="56" rx="8"/>
    <rect x="590" y="312" width="320" height="56" rx="8"/>
    <rect x="590" y="382" width="320" height="56" rx="8"/>
    <rect x="590" y="452" width="320" height="56" rx="8" stroke="#0E8A7D"/>
  </g>
  <g font-size="15" font-weight="600" fill="#14202E">
    <text x="606" y="196">Azure AI Search</text>
    <text x="606" y="266">Cosmos DB</text>
    <text x="606" y="336">Blob Storage</text>
    <text x="606" y="406">Key Vault</text>
    <text x="606" y="476">Azure OpenAI</text>
  </g>
  <g font-size="12.5" fill="#4A5B6D">
    <text x="606" y="215">hybrid retrieval, semantic ranker</text>
    <text x="606" y="285">chat session history</text>
    <text x="606" y="355">source documents</text>
    <text x="606" y="425">keys and connection strings</text>
    <text x="606" y="495">chat + embedding models (East US 2)</text>
  </g>

  <g stroke="#1F4E8C" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M125 66V150"/>
    <path d="M245 183H330"/>
    <path d="M520 183H545"/>
  </g>
  <g stroke="#1F4E8C" stroke-width="1.8" fill="none">
    <path d="M545 183V480"/>
  </g>
  <g stroke="#1F4E8C" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M545 200H590"/><path d="M545 270H590"/><path d="M545 340H590"/><path d="M545 410H590"/><path d="M545 480H590"/>
  </g>
  <text x="287" y="172" font-size="12" fill="#4A5B6D" text-anchor="middle">peering + PE</text>
  <text x="137" y="94" font-size="12" fill="#4A5B6D">HTTP / HTTPS</text>

  <rect x="45" y="330" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <text x="145" y="356" font-size="15" font-weight="600" fill="#14202E" text-anchor="middle">Azure Monitor</text>
  <text x="145" y="375" font-size="12.5" fill="#4A5B6D" text-anchor="middle">Log Analytics + App Insights</text>
  <rect x="45" y="410" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <text x="145" y="436" font-size="15" font-weight="600" fill="#14202E" text-anchor="middle">Private DNS zones</text>
  <text x="145" y="455" font-size="12.5" fill="#4A5B6D" text-anchor="middle">linked to hub and spoke</text>
</svg>
