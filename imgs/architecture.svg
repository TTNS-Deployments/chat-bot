<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">AI Based Chatbot architecture</title>
  <desc id="d">Users open the chat page on App Service. The web app searches Azure AI Search with hybrid and semantic ranking, sends the question and the sources to Azure OpenAI, and returns the answer with citations. Uploaded documents go to Blob Storage; the AI Search indexer splits and embeds them with the Azure OpenAI embedding model. Key Vault holds the administrator key for deleting documents. Application Insights and Log Analytics collect telemetry. All service-to-service calls use managed identities.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F4E8C"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B7A6E"/></marker>
    <style>
      .box { fill: #FFFFFF; stroke: #9DB3CB; stroke-width: 1.5; }
      .az { fill: #EEF4FC; stroke: #1F5FBF; stroke-width: 1.5; }
      .h { font-size: 15px; font-weight: 600; fill: #14202E; }
      .s { font-size: 12.5px; fill: #4A5B6D; }
      .flow { stroke: #1F4E8C; stroke-width: 2; fill: none; marker-end: url(#a); }
      .ingest { stroke: #0B7A6E; stroke-width: 2; fill: none; marker-end: url(#g); }
      .mon { stroke: #8A9AAC; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
      .num { fill: #1F4E8C; }
      .numg { fill: #0B7A6E; }
      .nt { font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .lbl { font-size: 12px; fill: #1F4E8C; }
      .lblg { font-size: 12px; fill: #0B7A6E; }
    </style>
  </defs>
  
  <rect width="1000" height="600" fill="#F7F9FC"/>
  <rect x="176" y="20" width="620" height="530" rx="14" fill="none" stroke="#C9D5E3" stroke-dasharray="6 5"/>
  <text x="192" y="42" class="s">Resource group · SKUs from Deployment/ARM/parameters/&lt;env&gt;.parameters.json</text>

  <!-- User -->
  <rect x="16" y="226" width="136" height="92" rx="12" class="box"/>
  <text x="84" y="258" class="h" text-anchor="middle">Users</text>
  <text x="84" y="279" class="s" text-anchor="middle">Browser:</text>
  <text x="84" y="296" class="s" text-anchor="middle">chat page</text>

  <!-- App Service -->
  <rect x="200" y="196" width="290" height="156" rx="12" class="az"/>
  <text x="216" y="224" class="h">App Service (Linux)</text>
  <text x="216" y="246" class="s">Chat page + API (FastAPI, Python 3.12)</text>
  <text x="216" y="265" class="s">/api/chat · /api/documents · /healthz</text>
  <text x="216" y="284" class="s">Creates the search index on startup</text>
  <text x="216" y="303" class="s">Rate limit · validation · CSP</text>
  <text x="216" y="334" class="s" font-style="italic">System-assigned managed identity</text>

  <!-- Azure OpenAI -->
  <rect x="548" y="64" width="232" height="104" rx="12" class="az"/>
  <text x="564" y="92" class="h">Azure OpenAI</text>
  <text x="564" y="114" class="s">chat deployment (answers)</text>
  <text x="564" y="133" class="s">embedding deployment</text>
  <text x="564" y="152" class="s">Entra ID only, keys disabled</text>

  <!-- AI Search -->
  <rect x="548" y="214" width="232" height="126" rx="12" class="az"/>
  <text x="564" y="242" class="h">Azure AI Search</text>
  <text x="564" y="264" class="s">documents-index</text>
  <text x="564" y="283" class="s">hybrid + semantic ranking</text>
  <text x="564" y="302" class="s">indexer + skillset</text>
  <text x="564" y="321" class="s">(split, embed) · managed identity</text>

  <!-- Storage -->
  <rect x="548" y="400" width="232" height="84" rx="12" class="az"/>
  <text x="564" y="428" class="h">Blob Storage</text>
  <text x="564" y="450" class="s">documents container</text>
  <text x="564" y="469" class="s">soft delete · shared keys off</text>

  <!-- Key Vault -->
  <rect x="200" y="414" width="290" height="70" rx="12" class="az"/>
  <text x="216" y="442" class="h">Key Vault (RBAC)</text>
  <text x="216" y="464" class="s">upload-api-key</text>

  <!-- Monitoring -->
  <rect x="824" y="64" width="160" height="420" rx="12" class="box"/>
  <text x="904" y="96" class="h" text-anchor="middle">Monitoring</text>
  <text x="904" y="250" class="s" text-anchor="middle">Application</text>
  <text x="904" y="267" class="s" text-anchor="middle">Insights</text>
  <text x="904" y="300" class="s" text-anchor="middle">Log Analytics</text>
  <text x="904" y="317" class="s" text-anchor="middle">workspace</text>

  <!-- 1 question, 5 answer -->
  <path d="M152 258 H196" class="flow"/>
  <circle cx="176" cy="244" r="10" class="num"/><text x="176" y="248" class="nt">1</text>
  <path d="M200 300 H156" class="flow"/>
  <circle cx="176" cy="314" r="10" class="num"/><text x="176" y="318" class="nt">5</text>
  <!-- 2 search -->
  <path d="M490 252 H544" class="flow"/>
  <circle cx="518" cy="238" r="10" class="num"/><text x="518" y="242" class="nt">2</text>
  <!-- 3 vectorize the query -->
  <path d="M610 214 V172" class="flow"/>
  <circle cx="626" cy="194" r="10" class="num"/><text x="626" y="198" class="nt">3</text>
  <!-- 4 grounded prompt -->
  <path d="M440 196 V116 H544" class="flow"/>
  <circle cx="440" cy="156" r="10" class="num"/><text x="440" y="160" class="nt">4</text>
  <text x="300" y="108" class="lbl">question + sources</text>

  <!-- A upload, B indexer reads, C embed chunks -->
  <path d="M460 352 V442 H544" class="ingest"/>
  <circle cx="510" cy="442" r="10" class="numg"/><text x="510" y="446" class="nt">A</text>
  <path d="M700 400 V344" class="ingest"/>
  <circle cx="716" cy="372" r="10" class="numg"/><text x="716" y="376" class="nt">B</text>
  <path d="M720 214 V172" class="ingest"/>
  <circle cx="736" cy="194" r="10" class="numg"/><text x="736" y="198" class="nt">C</text>

  <!-- Key Vault reference -->
  <path d="M300 414 V356" class="flow"/>
  <text x="310" y="390" class="lbl">Key Vault reference</text>

  <!-- telemetry -->
  <path d="M780 116 H820" class="mon"/>
  <path d="M780 277 H820" class="mon"/>
  <path d="M780 442 H820" class="mon"/>
  <path d="M230 196 V54 H904 V64" class="mon"/>

  <!-- legend -->
  <g transform="translate(24 566)">
    <path d="M0 8 H34" class="flow"/><text x="42" y="12" class="s">Question and answer (1-5)</text>
    <path d="M240 8 H274" class="ingest"/><text x="282" y="12" class="s">Document ingestion (A-C)</text>
    <path d="M480 8 H514" class="mon"/><text x="522" y="12" class="s">Telemetry and diagnostic logs</text>
  </g>
</svg>
