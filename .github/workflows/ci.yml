name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            Code/backend/requirements.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Install Bicep
        run: az bicep install

      - name: azuredeploy.json matches the Bicep source
        run: Deployment/scripts/build_arm.sh --check

      - name: Bicep lint
        run: az bicep lint --file Deployment/bicep/main.bicep

      - name: Tests (app, prompt building, deployment consistency)
        run: python -m pytest Code/backend -q

      - name: SKU presets
        run: make validate-skus

      - name: shellcheck
        run: shellcheck Deployment/scripts/*.sh .githooks/pre-commit

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path Deployment/scripts -Recurse
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      - name: Build package
        run: python Deployment/scripts/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: build/webapp.zip
          retention-days: 7
